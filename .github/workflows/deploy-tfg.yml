name: Deploy TFG

on:
  push:
    branches:
      - tfg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: ./mvnw package -DskipTests

      - name: Deploy to Hetzner TFG
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/orbitcontrol
          chmod 600 ~/.ssh/orbitcontrol
          ssh-keyscan -H 178.105.30.196 >> ~/.ssh/known_hosts
          scp -i ~/.ssh/orbitcontrol target/OrbitControl-0.0.1-SNAPSHOT.jar root@178.105.30.196:/opt/orbitcontrol/app-tfg.jar
          ssh -i ~/.ssh/orbitcontrol root@178.105.30.196 "systemctl restart orbitcontrol-tfg"
