<div class="flex flex-col h-screen overflow-hidden" [class.bg-gray-100]="showLayout()">

  <div class="flex flex-1 overflow-hidden">
    
    @if (showLayout()) {
      <app-sidebar /> 
    }

    <div class="flex-1 flex flex-col" [class.overflow-hidden]="showLayout()">
      
      @if (showLayout()) {
        <app-navbar />
      }
      <main class="flex-1 w-full h-screen flex flex-col"
            [class.overflow-auto]="showLayout()"
            [class.bg-gray-50]="showLayout()">
        <div class="flex-1" [class.p-6]="showLayout()">
          <router-outlet />
        </div>
        @if (showLayout()) {
          <app-footer />
        }
      </main>
    </div>

  </div>

</div>

<app-confirm />
<app-notification />
<app-nfc-upgrade-modal />
